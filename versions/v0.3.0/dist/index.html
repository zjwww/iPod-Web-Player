<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iPod Player">
  <meta name="description" content="Your music. A familiar wheel. A private, offline iPod player for local music.">
  <meta name="color-scheme" content="light dark">
  <title>iPod Web Player · v0.3.0</title>
  <link rel="icon" href="./icons/ipod.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./library.js"></script>
  <script defer src="./player-core.js"></script>
  <script defer src="./appearance/player-artwork.js"></script>
  <script defer src="./wheel-player.js"></script>
  <script defer src="./catalog.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./service-state.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="./" aria-label="iPod Player home"><span class="brand-dot" aria-hidden="true"></span>iPod <span>Player</span></a>
    <nav class="header-actions" aria-label="Player controls">
      <button id="language" class="text-button" type="button" aria-label="Switch to English">EN</button>
      <button id="help" class="icon-button" type="button" aria-label="使用说明" title="使用说明"><span aria-hidden="true">?</span></button>
      <button id="focus" class="icon-button" type="button" aria-label="沉浸与全屏" title="沉浸与全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    </nav>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow"><span class="status-dot"></span><span data-i18n="eyebrow">你的音乐，随身而行。</span></p>
      <h1 id="page-title" data-i18n="headline">好音乐。<br>转动之间。</h1>
      <p class="intro-copy" data-i18n="description">熟悉的滚轮，熟悉的感觉。<br>把自己的音乐，装进这台 iPod。</p>
      <div class="import-actions">
        <button id="import-files" class="primary-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span data-i18n="import">添加音乐</span></button>
        <button id="import-folder" class="secondary-button" type="button" data-i18n="folder">选择文件夹</button>
      </div>
      <p class="import-note" data-i18n="privacy">也可以将音乐拖入这里。文件只留在这台设备上。</p>
      <div class="library-summary">
        <span class="library-icon" aria-hidden="true">♫</span>
        <div><p id="library-count">还没有音乐</p><p id="library-detail" data-i18n="emptyDetail">从你喜爱的第一首开始。</p></div>
        <button id="library-open" class="small-link" type="button" data-i18n="manage">管理</button>
      </div>
      <button id="demo" class="demo-button" type="button"><span aria-hidden="true">▷</span> <span data-i18n="demo">先听一段演示</span><span class="demo-tag" data-i18n="original">原创合成音</span></button>
    </section>
    <section id="stage" class="stage" aria-label="iPod music player">
      <div class="stage-label"><span>2001</span><span class="label-rule"></span><span data-i18n="reimagined">经典，重新转动。</span></div>
      <div id="device-space" class="device-space"><div id="device-wrap" class="device-wrap"><web-music-ipod id="ipod"></web-music-ipod></div></div>
      <p class="wheel-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 7M19 3v5h-5"/></svg><span data-i18n="wheelHint">沿滚轮转动以浏览，按中央键选择。</span></p>
    </section>
  </main>
  <footer class="footer"><span>LOCAL MUSIC · v0.3.0 <span id="offline-state"></span><span id="server-state" aria-live="polite"></span></span><span data-i18n="footer">一点怀旧，全部是你的音乐。</span><div class="footer-actions"><a class="small-link" href="./credits.html" data-i18n="compare">素材与许可</a><button id="install" class="small-link" type="button" data-i18n="install">添加到主屏幕</button></div></footer>
  <div class="focus-controls"><button id="focus-import" class="icon-button" type="button" aria-label="添加音乐">＋</button><button id="focus-exit" class="icon-button" type="button" aria-label="退出沉浸模式">×</button></div>
  <input id="files" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.webm,.aif,.aiff" multiple hidden>
  <input id="folder" type="file" accept="audio/*" webkitdirectory multiple hidden>
  <div id="drop-overlay" class="drop-overlay" hidden><div><span aria-hidden="true">↓</span><p data-i18n="drop">把音乐放在这里。</p></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="help-dialog">
    <div class="dialog-top"><p class="eyebrow">iPod Player</p><button class="icon-button close-dialog" type="button" aria-label="Close">×</button></div>
    <h2 data-i18n="helpTitle">让熟悉的手感回来。</h2>
    <div id="help-content"></div>
    <p class="dialog-note" data-i18n="helpFoot">本地实验项目，与 Apple 无关联。音乐文件不会上传。</p>
  </dialog>
  <dialog id="library-dialog">
    <div class="dialog-top"><p class="eyebrow" data-i18n="library">本地曲库</p><button class="icon-button close-dialog" type="button" aria-label="Close">×</button></div>
    <h2 id="manage-title">你的音乐。</h2><p id="storage-status" class="dialog-note"></p>
    <ul id="track-list" class="track-list"></ul>
    <div class="library-bottom"><button id="add-more" class="secondary-button" type="button" data-i18n="addMore">继续添加</button><button id="clear-library" class="small-link danger" type="button" data-i18n="clear">清空曲库</button></div>
  </dialog>
  <noscript>This player needs JavaScript enabled. 此播放器需要启用 JavaScript。</noscript>
</body>
</html>
